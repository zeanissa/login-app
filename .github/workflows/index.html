<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <section class="panel left-panel">
      <div class="brand">
        <h1>Nama Aplikasi</h1>
        <p>Selamat datang — masuk untuk melanjutkan.</p>
      </div>
      <div class="illustration" aria-hidden="true">
        <!-- Ganti dengan gambar/ikon Anda -->
      </div>
    </section>

    <section class="panel right-panel">
      <form id="loginForm" class="login-form" novalidate>
        <h2>Masuk</h2>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username" />

        <label for="password">Kata sandi</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />

        <div class="actions">
          <button type="submit">Masuk</button>
        </div>

        <p id="formError" class="error" role="alert" aria-live="polite" hidden></p>
      </form>
    </section>
  </main>

  <script>
    // Validasi sederhana sebelum submit (ajukan ke backend yang Anda miliki)
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const email = document.getElementById('email');
      const pass = document.getElementById('password');
      const err = document.getElementById('formError');
      err.hidden = true;
      if (!email.value || !pass.value) {
        err.textContent = 'Mohon isi email dan kata sandi.';
        err.hidden = false;
        return;
      }
      // Contoh: kirim fetch ke endpoint /login (sesuaikan)
      fetch('/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email: email.value, password: pass.value})
      }).then(r => {
        if (!r.ok) throw new Error('Login gagal');
        window.location.href = '/dashboard';
      }).catch(() => {
        err.textContent = 'Login gagal — periksa kredensial atau coba lagi nanti.';
        err.hidden = false;
      });
    });
  </script>
</body>
</html>
